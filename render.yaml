# Blueprint: Fitdog Route Generator worker
# Dashboard → New → Blueprint → connect Lsandwork/digiWhiteboard
# Or: RENDER_API_KEY=... ./scripts/deploy-route-worker-render.sh
services:
  - type: web
    name: fitdog-route-worker
    runtime: docker
    plan: free
    region: oregon
    branch: main
    rootDir: services/route-worker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ROUTE_WORKER_SIGNING_SECRET
        sync: false
      - key: ROUTE_WORKER_CALLBACK_SECRET
        sync: false
